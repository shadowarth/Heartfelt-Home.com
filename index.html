<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heartfelt Home - Mobile Salon Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --primary-color: #6a1b9a;
            --secondary-color: #ff4081;
            --accent-color: #00e676;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
            --border-light: #e0e0e0;
            --gradient-main: linear-gradient(135deg, #6a1b9a 0%, #ff4081 100%);
            --gradient-card: linear-gradient(135deg, #ffffff 0%, #fff9fb 100%);
            --pink-glow: #ffb6c1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg,
                    #ffd1dc 0%, #ffb6c1 20%, #ff9eb5 40%, #ff8fab 60%, #ff9eb5 80%, #ffd1dc 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
        }
        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 15px 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2.6rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
            letter-spacing: 1px;
            font-weight: bold;
        }
        .nav-links {
            list-style: none;
            display: flex;
            gap: 35px;
        }
        .nav-links li {
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #555;
            padding: 8px 15px;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        .nav-links li:hover, .nav-links li.active {
            color: var(--text-light);
            background: var(--gradient-main);
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.3);
        }
        .tab-content {
            display: none;
            padding: 120px 20px 60px;
            flex-grow: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            z-index: 2;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .hero {
            text-align: center;
            background-image: linear-gradient(rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.95)), url('vecteezy_woman-hands-receiving-a-manicure_12649597.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 25px;
            padding: 100px 40px;
            box-shadow: 0 20px 50px rgba(255, 64, 129, 0.15);
            margin-bottom: 60px;
            border: 1px solid rgba(255, 182, 193, 0.6);
            position: relative;
        }
        .hero h1 {
            font-size: 3.8rem;
            margin-bottom: 25px;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(255, 64, 129, 0.1);
        }
        .hero p {
            font-size: 1.15rem;
            max-width: 800px;
            margin: 0 auto;
            color: #444;
            line-height: 1.8;
            font-weight: 500;
        }
        .section-title {
            text-align: center;
            font-size: 2.8rem;
            margin-bottom: 50px;
            color: var(--primary-color);
            font-weight: 700;
            position: relative;
            text-shadow: 0 2px 8px rgba(255, 64, 129, 0.1);
        }
        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--gradient-main);
            margin: 15px auto 0;
            border-radius: 5px;
            box-shadow: 0 2px 10px rgba(255, 64, 129, 0.3);
        }
        .slider-section {
            max-width: 1000px;
            margin: 0 auto 60px;
        }
        .slider-container {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 64, 129, 0.15);
            background: #fff;
            border: 2px solid rgba(255, 182, 193, 0.4);
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            display: flex;
            visibility: hidden;
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            margin: auto;
        }
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary-color);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .slider-btn:hover {
            background: var(--gradient-main);
            color: var(--text-light);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 6px 15px rgba(255, 64, 129, 0.4);
        }
        .slider-btn.prev { left: 15px; }
        .slider-btn.next { right: 15px; }
        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }
        .price-card-modern {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef0f4;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .price-card-modern:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 35px rgba(255, 64, 129, 0.12);
            border-color: rgba(255, 64, 129, 0.25);
        }
        .card-image-wrap {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #f8f9fa;
        }
        .card-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .badge-popular {
            position: absolute;
            top: 0;
            left: 0;
            background: #ff6b00;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 18px;
            border-bottom-right-radius: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(255, 107, 0, 0.3);
            z-index: 2;
        }
        .badge-rating {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            z-index: 2;
        }
        .badge-rating .stars { color: #ff9800; letter-spacing: -1px; }
        .badge-rating .count { color: #64748b; font-size: 0.8rem; margin-left: 2px; }
        .card-image-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 2;
        }
        .card-image-dots .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
        }
        .card-image-dots .dot.active {
            background: #ffffff;
            width: 8px;
            height: 8px;
        }
        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a202c;
            margin: 0;
            line-height: 1.3;
            font-family: 'Poppins', sans-serif;
        }
        .card-price-container {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
